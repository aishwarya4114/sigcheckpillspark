<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SigCheck scorecard</title>
<style>
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;background:#f6f7f9;color:#16202c}
header{background:#0f1b2d;color:#fff;padding:12px 18px;display:flex;gap:16px}header a{color:#cfe0ff;margin-left:auto}
.wrap{max-width:1000px;margin:20px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:1px solid #dde2e8;border-radius:12px;padding:16px}.num{font-size:34px;font-weight:700}.muted{color:#5b6675;font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:16px;border:1px solid #dde2e8}td,th{padding:8px 10px;border-bottom:1px solid #eef0f3;text-align:left;font-size:14px}
</style></head><body>
<header><b>SigCheck · scorecard</b><a href="/">Back to review</a></header>
<div class="wrap" id="w">Loading…</div>
<script>
fetch("/api/scorecard").then(r=>r.json()).then(s=>{
  if(s.error){document.querySelector("#w").textContent=s.error;return}
  const pct=(a,b)=>b?Math.round(100*a/b)+"%":"–";
  document.querySelector("#w").innerHTML=`<p class="muted">${s.scope}. Reader: ${s.reader}. Run ${s.run_at}.</p>
  <div class="cards">
   <div class="card"><div class="num">${s.traps_caught.caught} / ${s.traps_caught.of}</div>Planted errors caught</div>
   <div class="card"><div class="num">${pct(s.verified_precision.right,s.verified_precision.of)}</div>When a field passed every check, it was right<div class="muted">${s.verified_precision.right} of ${s.verified_precision.of} fields</div></div>
   <div class="card"><div class="num">${s.invented_values_on_absent_fields}</div>Values invented for fields that weren't on the fax</div>
   <div class="card"><div class="num">${pct(s.field_accuracy.exact,s.field_accuracy.of)}</div>Field accuracy (exact match)<div class="muted">${s.field_accuracy.exact} of ${s.field_accuracy.of}</div></div>
  </div>
  <table><tr><th>Fax</th><th>Planted trap</th><th>Result</th><th>Flagged?</th></tr>
  ${s.rows.map(r=>`<tr><td>${r.fax}</td><td>${r.trap}</td><td>${r.status}</td><td>${r.flagged?"✓ yes":"✕ no"}</td></tr>`).join("")}</table>`;
});
</script></body></html>
